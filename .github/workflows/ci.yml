name: MOPSENTRY website CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test
      - name: Build static SPA
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://zykswpgxfmpjllnlivkd.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_z9qQm67PhhPwpO3jTP3PUw_nM0C4LY-
      - name: Type-check TypeScript
        run: bunx tsc --noEmit
      - name: Verify static entrypoint
        run: test -f dist/client/index.html

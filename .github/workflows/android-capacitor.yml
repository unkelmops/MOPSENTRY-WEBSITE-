name: Android Capacitor debug build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "capacitor.config.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/android-capacitor.yml"
      - "src/routes/**"
      - "src/styles.css"

permissions:
  contents: read

jobs:
  build-android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install web dependencies
        run: bun install
      - name: Build hosted web app assets
        run: bun run build
      - name: Add Capacitor toolchain
        run: |
          bun add @capacitor/core @capacitor/android
          bun add --dev @capacitor/cli
      - name: Generate Android project
        run: bunx cap add android
      - name: Prepare Capacitor Android assets directory
        run: mkdir -p android/app/src/main/assets/public
      - name: Sync Android project
        run: bunx cap sync android
      - name: Build installable debug APK
        run: |
          cd android
          ./gradlew assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mopsentry-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
name: iOS Capacitor validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "capacitor.config.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/ios-capacitor.yml"
      - "docs/ios-testing.md"
      - "src/routes/**"
      - "src/styles.css"

permissions:
  contents: read

jobs:
  build-ios-simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install web dependencies
        run: bun install
      - name: Add Capacitor toolchain
        run: |
          bun add @capacitor/core @capacitor/ios
          bun add --dev @capacitor/cli
      - name: Generate and sync iOS project
        run: |
          bunx cap add ios
          bunx cap sync ios
      - name: Build unsigned iOS Simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: mopsentry-ios-simulator
          path: build/ios-derived/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 7
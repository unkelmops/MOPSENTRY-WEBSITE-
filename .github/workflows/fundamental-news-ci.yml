name: MOPSENTRY validation and fundamental history

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  validate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit tests
        run: bun run test
      - name: Build application
        run: bun run build

  collect-fundamental-history:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Collect upcoming and recently released USD events
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 45 \
            "https://mopsentry-bot.lovable.app/api/public/fundamental-history"